name: Daily Digest

on:
  schedule:
    - cron: "0 13 * * *"  # 8am central
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -e
          if [ -f "./requirements.txt" ]; then
            pip install -r ./requirements.txt
          else
            echo "requirements.txt not found"; exit 1
          fi

      # STEP 1: decode gmail credentials and token from base64 secrets
      - name: Write Gmail credentials and token
        env:
          GMAIL_CREDENTIALS_B64: ${{ secrets.GMAIL_CREDENTIALS_B64 }}
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          set -e
          mkdir -p ./secrets
          echo "$GMAIL_CREDENTIALS_B64" | base64 --decode > ./secrets/credentials.json
          echo "$GMAIL_TOKEN_B64" | base64 --decode > ./secrets/token.json
          echo "wrote credentials.json and token.json"

      # STEP 2: decode config.yaml from base64 secret
      - name: Write config.yaml from secret
        env:
          CONFIG_YAML_B64: ${{ secrets.CONFIG_YAML_B64 }}
        run: |
          set -e
          echo "$CONFIG_YAML_B64" | base64 --decode > ./config.yaml
          echo "wrote config.yaml from github secret"

      # STEP 3: run subscription checker
      - name: Run subscription check (subscribe_bot.py)
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          set -e
          echo "checking for new subscription emails..."
          if [ -f "./scripts/subscribe_bot.py" ]; then
            python ./scripts/subscribe_bot.py
          else
            echo "subscribe_bot.py not found — skipping"
          fi

      # STEP 4: run unsubscription checker
      - name: Run unsubscription check (unsubscribe_bot.py)
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          set -e
          echo "checking for unsubscribe requests..."
          if [ -f "./scripts/unsubscribe_bot.py" ]; then
            python ./scripts/unsubscribe_bot.py
          else
            echo "unsubscribe_bot.py not found — skipping"
          fi

      # STEP 5: run the main daily digest bot
      - name: Run daily digest bot
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TEST_MODE: ${{ secrets.TEST_MODE }}
          GMAIL_CREDENTIALS_B64: ${{ secrets.GMAIL_CREDENTIALS_B64 }}
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          set -e
          echo "running arXiv digest bot..."
          if [ -f "./bot.py" ]; then
            python ./bot.py ./config.yaml
          else
            echo "bot.py not found in repo"; exit 1
          fi
