name: Daily astro-ph Digest

on:
  schedule:
    - cron: "0 13 * * *"  # 8am central
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -e
          if [ -f "./requirements.txt" ]; then
            pip install -r ./requirements.txt
          else
            echo "requirements.txt not found"; exit 1
          fi

      - name: Write Gmail credentials and token
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -e
          mkdir -p ./secrets
          echo "$GMAIL_CREDENTIALS_JSON" > ./secrets/credentials.json
          echo "$GMAIL_TOKEN_JSON" > ./secrets/token.json
          echo "wrote credentials.json and token.json"

      - name: Write config.yaml from secret
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          echo "$CONFIG_YAML" > ./config.yaml
          echo "wrote config.yaml from github secret"

      - name: Run subscription check (subscribe_bot.py)
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          set -e
          echo "checking for new subscription emails..."
          if [ -f "./scripts/subscribe_bot.py" ]; then
            python ./scripts/subscribe_bot.py
          else
            echo "subscribe_bot.py not found — skipping"
          fi

      - name: Run unsubscription check (unsubscribe_bot.py)
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          set -e
          echo "checking for unsubscribe requests..."
          if [ -f "./scripts/unsubscribe_bot.py" ]; then
            python ./scripts/unsubscribe_bot.py
          else
            echo "unsubscribe_bot.py not found — skipping"
          fi

      - name: Run astro-ph digest bot
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TEST_MODE: ${{ secrets.TEST_MODE }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -e
          echo "running astro-ph digest bot..."
          if [ -f "./bot.py" ]; then
            python ./bot.py ./config.yaml
          else
            echo "bot.py not found in repo"; exit 1
          fi
