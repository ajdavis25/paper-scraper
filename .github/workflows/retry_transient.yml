name: Retry Transient Failures

# re-runs a failed scheduled workflow (e.g. when GitHub never assigns a
# runner: "The job was not acquired by Runner of type hosted"). capped at
# 3 total attempts so a genuine code failure doesn't retry forever.
on:
  workflow_run:
    workflows:
      - "Daily Digest"
      - "Weekly Highlights Digest"
      - "Renew Gmail watch (weekly)"
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "attempt ${{ github.event.workflow_run.run_attempt }} of '${{ github.event.workflow_run.name }}' failed — re-running"
          gh run rerun ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
