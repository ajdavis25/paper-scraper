{% extends "base.html" %} {% block title %}send feedback — astro-ph digest{%
endblock %} {% block content %}
<div class="feedback-container card">
  <h2>send me your feedback</h2>
  <p class="muted">
    i'd love to hear your thoughts or suggestions about the digest!
  </p>

  <form id="feedback-form" class="feedback-form">
    <div class="form-group">
      <label for="name">name (optional)</label>
      <input type="text" id="name" placeholder="your name" />
    </div>

    <div class="form-group">
      <label for="email">email (optional)</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>

    <div class="form-group">
      <label for="message">message</label>
      <textarea id="message" rows="4" placeholder="your feedback..."></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="save-btn">send feedback</button>
      <p id="feedback-status" class="save-status"></p>
    </div>
  </form>
</div>
{% endblock %}
