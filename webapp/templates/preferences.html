{% extends "base.html" %} {% block title %}preferences — arXiv digest{% endblock
%} {% block content %}
<div class="prefs-container page-card">
  <h2>customize your digest topics</h2>

  <label for="categories"><strong>arXiv categories</strong></label>
  <select id="categories" name="categories" multiple size="6">
    <option value="astro-ph">astrophysics</option>
    <option value="cond-mat">condensed matter</option>
    <option value="cs">computer science</option>
    <option value="gr-qc">general relativity & quantum cosmology</option>
    <option value="hep-ex">high energy physics - experiment</option>
    <option value="hep-lat">high energy physics - lattice</option>
    <option value="hep-ph">high energy physics - phenomenology</option>
    <option value="hep-th">high energy physics - theory</option>
    <option value="math">mathematics</option>
    <option value="math-ph">mathematical physics</option>
    <option value="nucl-ex">nuclear experiment</option>
    <option value="nucl-th">nuclear theory</option>
    <option value="physics">physics (general)</option>
    <option value="quant-ph">quantum physics</option>
    <option value="q-bio">quantitative biology</option>
    <option value="q-fin">quantitative finance</option>
    <option value="stat">statistics</option>
    <option value="eess">electrical engineering and systems science</option>
    <option value="econ">economics</option>
  </select>
  <small>hold ctrl (windows) or cmd (mac) to select multiple.</small>

  <form id="prefs-form" class="prefs-form">
    <div class="form-group">
      <label for="keywords">keywords (comma separated)</label>
      <textarea
        id="keywords"
        name="keywords"
        rows="3"
        placeholder="e.g. black hole, accretion, VLBI"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="excluded_keywords">excluded keywords (comma separated)</label>
      <textarea
        id="excluded_keywords"
        name="excluded_keywords"
        rows="3"
        placeholder="e.g. tutorial, review, or boring topics you don't want"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="authors">preferred authors (comma separated)</label>
      <textarea
        id="authors"
        name="authors"
        rows="3"
        placeholder="e.g. Anantua, Quataert, Järvelä"
      ></textarea>
    </div>

    <div class="form-group-inline">
      <label for="min_score">minimum relevance score</label>
      <input
        type="number"
        id="min_score"
        name="min_score"
        value="1.0"
        step="0.1"
        min="0"
      />
      <small>
        (papers with a score below this threshold will be excluded from your
        digest)
      </small>
    </div>

    <button type="submit" class="save-btn">save preferences</button>

    <button type="button" class="view-btn" id="view-current">
      view current preferences
    </button>
    <div id="current-prefs" class="current-prefs"></div>
  </form>

  <p id="save-status" class="save-status"></p>
</div>
{% endblock %}
