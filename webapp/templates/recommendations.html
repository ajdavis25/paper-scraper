{% extends "base.html" %} {% block title %}recommendations — astro-ph digest{%
endblock %} {% block content %} {% for rec in recs %}
<div
  class="paper"
  id="paper-{{ loop.index }}"
  data-title="{{ rec.title|e }}"
  data-link="{{ rec.link|e }}"
>
  <a href="{{ rec.link }}" target="_blank" class="title">{{ rec.title }}</a>
  <div class="date">{{ rec.published }}</div>
  <p>{{ rec.summary }}</p>

  <div class="feedback-buttons">
    <button class="btn btn-light like-btn">👍 like</button>
    <button class="btn btn-light dislike-btn">👎 dislike</button>
  </div>
</div>
{% endfor %} {% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/recommendations.js') }}"></script>
{% endblock %}
