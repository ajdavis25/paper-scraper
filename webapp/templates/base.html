<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}astro-ph digest{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1><a href="/">astro-ph digest</a></h1>
    <nav>
      <a href="/subscribe">subscribe</a>
      <a href="/unsubscribe">unsubscribe</a>

      {% if user and user.email %}
        <a href="/dashboard/{{ user.email }}">dashboard</a>
      {% else %}
        <a href="/dashboard">dashboard</a>
      {% endif %}

      <a href="/preferences">preferences</a>
      <a href="/recommendations">recommendations</a>
      <a href="/view-feedback">user feedback</a>
      <a href="/send-feedback">send feedback</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>built out of spite because stanford gatekept vox charta</p>
  </footer>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
    <!-- mathjax for latex rendering -->
    <script>
    window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
    </script>
    <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

</body>
</html>
